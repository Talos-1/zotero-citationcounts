name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install validation dependencies
        run: pip install --quiet fluent.syntax

      - name: Static checks
        run: sh bin/validate.sh

      - name: Unit tests
        run: node test/test.js

      - name: Upload built XPI
        uses: actions/upload-artifact@v7
        with:
          name: xpi
          path: '*.xpi'
          if-no-files-found: error
